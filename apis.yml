apis:
  - aid: smile-cdr:smile-cdr-fhir-endpoint
    name: Smile CDR FHIR Endpoint
    description: >-
      The core FHIR REST API exposed by every Smile CDR FHIR Endpoint module.
      Supports the full FHIR REST interaction set (read, vread, update,
      patch, delete, history, search, transaction, batch, conditional CRUD)
      across FHIR R4, R5, STU3, and DSTU2, plus FHIRPath, custom search
      parameters, custom operations, and conformance via the
      `/metadata` CapabilityStatement. OpenAPI / Swagger UI is
      auto-generated and served at `{baseUrl}/swagger-ui/` when enabled.
    humanURL: https://smilecdr.com/docs/fhir/standard.html
    tags:
      - FHIR
      - REST API
      - CRUD
      - Search
      - CapabilityStatement
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/fhir/standard.html
      - type: Documentation
        url: https://smilecdr.com/docs/fhir/crud_operations.html
      - type: Documentation
        url: https://smilecdr.com/docs/fhir/searching.html
      - type: OpenAPISupport
        url: https://smilecdr.com/docs/fhir_repository/openapi_swagger.html
      - type: SwaggerUI
        url: https://hapi.fhir.org/baseR4/swagger-ui/
  - aid: smile-cdr:smile-cdr-smart-on-fhir
    name: Smile CDR SMART on FHIR
    description: >-
      SMART on FHIR / OAuth2 / OIDC authorization surface for FHIR endpoints,
      supporting standalone launch, EHR launch, public and confidential
      clients, scopes, PKCE, refresh tokens, and consent. Includes
      `.well-known/smart-configuration`, authorization, token, introspection,
      and revocation endpoints.
    humanURL: https://smilecdr.com/docs/smart/index.html
    tags:
      - SMART on FHIR
      - Authentication
      - OIDC
      - Authorization
      - Consent
    tags_raw:
      - SMART on FHIR
      - OAuth2
      - OIDC
      - Authorization
      - Consent
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/smart/index.html
      - type: Documentation
        url: https://smilecdr.com/docs/security/openid_connect.html
  - aid: smile-cdr:smile-cdr-bulk-data
    name: Smile CDR Bulk Data
    description: >-
      Implementation of the FHIR Bulk Data Access (Flat FHIR) specification
      for asynchronous, system-, group-, and patient-level export of FHIR
      resources as NDJSON, with status polling, manifest, and backend
      services authorization.
    humanURL: https://smilecdr.com/docs/bulk/fhir_bulk_export.html
    tags:
      - Bulk Data
      - ND-JSON
      - Export
      - Asynchronous
    tags_raw:
      - Bulk Data
      - NDJSON
      - Export
      - Asynchronous
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/bulk/fhir_bulk_export.html
      - type: Documentation
        url: https://smilecdr.com/docs/bulk/fhir_bulk_import.html
  - aid: smile-cdr:smile-cdr-subscriptions
    name: Smile CDR Subscriptions
    description: >-
      FHIR Subscription (R4) and Subscription / SubscriptionTopic (R4B/R5
      backport) support for push notifications on resource change, with
      REST hook, websocket, email, and message-queue channels.
    humanURL: https://smilecdr.com/docs/fhir/subscriptions.html
    tags:
      - Subscription
      - Webhook
      - Event-Driven
      - Notification
    tags_raw:
      - Subscriptions
      - Webhooks
      - Event Driven
      - Notifications
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/fhir/subscriptions.html
  - aid: smile-cdr:smile-cdr-mdm
    name: Smile CDR Master Data Management
    description: >-
      FHIR-native Master Data Management for Patient and Practitioner records,
      with probabilistic matching, golden records, candidate matching rules,
      survivorship, and administrative override via the MDM Admin endpoint
      and `$mdm-*` FHIR operations.
    humanURL: https://smilecdr.com/docs/mdm/mdm.html
    tags:
      - MDM
      - Master Data Management
      - Patient Matching
      - Golden Record
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/mdm/mdm.html
  - aid: smile-cdr:smile-cdr-terminology
    name: Smile CDR Terminology Services
    description: >-
      Terminology Service implementing FHIR `$expand`, `$validate-code`,
      `$lookup`, `$translate`, and `$subsumes` operations over CodeSystems,
      ValueSets, and ConceptMaps. Bundled support for SNOMED CT, LOINC,
      ICD-10/11, RxNorm, and CPT, with bulk terminology upload.
    humanURL: https://smilecdr.com/docs/terminology/index.html
    tags:
      - Terminology
      - CodeSystem
      - ValueSet
      - ConceptMap
      - SNOMED CT
      - LOINC
