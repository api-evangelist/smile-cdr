  - aid: smile-cdr:smile-cdr-hl7-v2
    name: Smile CDR HL7 v2.x Interface
    description: >-
      MLLP-based HL7 v2.x inbound and outbound interfaces for ADT, ORM, ORU,
      MDM, SIU, VXU, and DFT messages, with bidirectional v2-to-FHIR mapping
      and ACK/NAK handling.
    humanURL: https://smilecdr.com/docs/hl7v2x/hl7v2x_support.html
    tags:
