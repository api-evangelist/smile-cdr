  - aid: smile-cdr:smile-cdr-cms-suite
    name: Smile CDR CMS Interoperability Suite
    description: >-
      Pre-packaged CMS-compliant FHIR APIs for US payers — Patient Access,
      Provider Directory, Drug Formulary, Payer-to-Payer (CMS-9115-F) and
      Prior Authorization (CMS-0057-F / HL7 Da Vinci PAS, CRD, DTR) — built
      on Smile CDR with US Core, CARIN BB, Da Vinci, and PDex profiles.
    humanURL: https://www.smiledigitalhealth.com/solution/cms-suite
