aid: smile-cdr
name: Smile Digital Health
description: >-
  Smile Digital Health (formerly Smile CDR) is a Toronto-based health
  interoperability software company and the commercial steward of the open
  source HAPI FHIR project (the world's most widely deployed Java
  implementation of the HL7 FHIR standard). Its flagship product, Smile CDR
  — marketed under the broader Smile Omni portfolio as the OmniVera Health
  Data Platform — is a FHIR-native clinical data repository and integration
  platform that ingests HL7 v2.x, CDA, CSV, JSON, XML, and FHIR payloads,
  normalizes them into FHIR (R4, R5, STU3, DSTU2), and exposes them through
  a hardened FHIR REST API, SMART on FHIR / OAuth2 / OIDC security, Bulk
  Data export, Subscriptions, MDM, Terminology Services, CQL-based Quality
  Measures, and a JSON Admin API. The platform is deployed on-prem and
  across AWS, Azure, and GCP, with HITRUST v9.4, SOC 2 Type II, ISO 27001,
  and ONC 2015 Edition certifications, and is used by 190+ global
  customers, including 30+ US payers running CMS Interoperability and
  Prior Authorization (CMS-0057-F) workloads on its CMS Suite. Adjacent
  Smile Omni product families include OmniCompli (regulatory compliance,
  including CMS Suite and CMS Concierge), OmniQ (digital quality measures
  / HEDIS, Intelligence Hub), and OmniConcierge (managed and professional
  services). The primary developer surface is the FHIR REST API, with
  per-endpoint auto-generated OpenAPI / Swagger UI at `{baseUrl}/swagger-ui/`,
  plus a separate JSON Admin API for cluster, module, user, audit, batch
  job, MDM, and OpenID Connect administration.
