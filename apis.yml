        url: https://smilecdr.com/docs/terminology/index.html
  - aid: smile-cdr:smile-cdr-cql-quality-measures
    name: Smile CDR CQL & Quality Measures
    description: >-
      Clinical Quality Language (CQL) engine and FHIR Clinical Reasoning
      module (Measure, Library, PlanDefinition) backing OmniQ digital
      Quality Measures (dQM) including HEDIS measures, with `$evaluate-measure`
      and `$apply` operations.
    humanURL: https://smilecdr.com/docs/measures/index.html
    tags:
      - CQL
      - Quality Measures
      - HEDIS
      - dQM
      - Clinical Reasoning
    properties:
      - type: Documentation
        url: https://smilecdr.com/docs/measures/index.html
  - aid: smile-cdr:smile-cdr-cda-exchange
    name: Smile CDR CDA Exchange
    description: >-
      Bidirectional HL7 CDA / C-CDA exchange — ingest CDA documents and
      convert to FHIR Bundle, and render FHIR data as CDA for partners that
      consume the older standard. Exposed via the CDA Exchange Admin
      endpoint and inbound document upload channels.
    humanURL: https://smilecdr.com/docs/cda_exchange/cda_exchange.html
    tags:
