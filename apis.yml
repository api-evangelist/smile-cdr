  - aid: smile-cdr:smile-cdr-json-admin-api
    name: Smile CDR JSON Admin API
    description: >-
      REST/JSON administrative API for cluster operations — Module Config,
      System Config, User Management, Audit Log, Transaction Log,
      Troubleshooting Log, Metrics, Runtime Status, Batch Job, Bulk Import,
      MDM Admin, OpenID Connect Clients / Keystores / Servers / Sessions,
      Privacy Notice, and Version. Permission-scoped (VIEW_MODULE_CONFIG,
      UPDATE_MODULE_CONFIG, CONTROL_MODULE, etc.).
    humanURL: https://smilecdr.com/docs/json_admin_endpoints/json_admin_api.html
    tags:
